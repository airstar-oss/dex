name: Download and Decompile APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: apk-decompile-${{ github.ref }}
  cancel-in-progress: true

env:
  APK_URL: https://archive.org/download/que-apks/apks/com.ss.android.ttmd.video-47.5.3-arm64-v8a.apks
  JADX_VERSION: "1.5.1"

jobs:
  decompile:
    name: Decompile Base APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip default-jre

      - name: Download APKS
        run: |
          set -euo pipefail

          wget \
            --tries=3 \
            --timeout=60 \
            -O application.apks \
            "$APK_URL"

          test -s application.apks
          unzip -t application.apks

      - name: Extract Base APK
        run: |
          set -euo pipefail

          mkdir -p extracted

          BASE_ENTRY=$(unzip -Z1 application.apks | grep -E '(^|/)base\.apk$' | head -n 1 || true)

          if [ -z "$BASE_ENTRY" ]; then
            echo "::error::base.apk not found in APKS archive."
            echo "Archive contents:"
            unzip -Z1 application.apks
            exit 1
          fi

          echo "Found: $BASE_ENTRY"

          unzip -p application.apks "$BASE_ENTRY" > extracted/base.apk

          if [ ! -s extracted/base.apk ]; then
            echo "::error::Extracted base.apk is empty."
            exit 1
          fi

          file extracted/base.apk
          ls -lh extracted/base.apk

      - name: Install JADX
        run: |
          set -euo pipefail

          JADX_URL="https://github.com/skylot/jadx/releases/download/v${JADX_VERSION}/jadx-${JADX_VERSION}.zip"

          wget -q "$JADX_URL" -O jadx.zip

          mkdir -p jadx
          unzip -q jadx.zip -d jadx
          chmod +x jadx/bin/jadx

          jadx/bin/jadx --version

      - name: Decompile Base APK
        run: |
          set -euo pipefail

          mkdir -p decompiled

          jadx/bin/jadx \
            --show-bad-code \
            --decompilation-mode auto \
            -d decompiled \
            extracted/base.apk

          if [ ! -d decompiled/sources ] && [ ! -d decompiled/resources ]; then
            echo "::error::JADX did not generate source or resource output."
            exit 1
          fi

          echo "Decompilation completed."
          du -sh decompiled

      - name: Upload Decompiled Sources and Resources
        uses: actions/upload-artifact@v4
        with:
          name: base-apk-decompiled
          path: decompiled/
          if-no-files-found: error
          compression-level: 6
          retention-days: 14

      - name: Upload Original Base APK
        uses: actions/upload-artifact@v4
        with:
          name: base-apk
          path: extracted/base.apk
          if-no-files-found: error
          retention-days: 14
