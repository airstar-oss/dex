name: Decompile Base APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: jadx-${{ github.ref }}
  cancel-in-progress: true

env:
  APK_URL: https://archive.org/download/que-apks/apks/com.ss.android.ttmd.video-47.5.3-arm64-v8a.apks
  JADX_VERSION: "1.5.1"

jobs:
  decompile:
    name: Decompile Base APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            wget \
            unzip \
            openjdk-17-jre-headless

      - name: Download APKS
        run: |
          set -euo pipefail

          wget \
            --tries=3 \
            --timeout=60 \
            --progress=dot:giga \
            -O application.apks \
            "$APK_URL"

          test -s application.apks
          unzip -t application.apks

      - name: Extract Base APK
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p extracted

          BASE_ENTRY=$(
            unzip -Z1 application.apks |
              awk 'tolower($0) ~ /(^|\/)base\.apk$/ { print; exit }'
          )

          if [[ -z "$BASE_ENTRY" ]]; then
            echo "::error::base.apk not found."
            exit 1
          fi

          echo "Extracting: $BASE_ENTRY"

          unzip -p application.apks "$BASE_ENTRY" > extracted/base.apk

          test -s extracted/base.apk

          ls -lh extracted/base.apk

      - name: Install JADX
        run: |
          set -euo pipefail

          URL="https://github.com/skylot/jadx/releases/download/v${JADX_VERSION}/jadx-${JADX_VERSION}.zip"

          wget -q "$URL" -O jadx.zip

          mkdir -p jadx
          unzip -q jadx.zip -d jadx

          chmod +x jadx/bin/jadx

          jadx/bin/jadx --version

      - name: Decompile Source and Resources
        env:
          JAVA_TOOL_OPTIONS: >-
            -Xms256m
            -Xmx4g
            -XX:+UseG1GC
        run: |
          set -euo pipefail

          mkdir -p decompiled/sources
          mkdir -p decompiled/resources

          echo "Starting JADX..."
          echo "Threads: 2"
          echo "Heap: 4 GB"

          jadx/bin/jadx \
            --threads-count 2 \
            --decompilation-mode auto \
            --log-level WARN \
            --output-dir-src decompiled/sources \
            --output-dir-res decompiled/resources \
            extracted/base.apk \
            2>&1 | tee jadx.log

          echo "JADX process completed."

          if ! find decompiled/sources -type f -name '*.java' -print -quit | grep -q .; then
            echo "::error::No Java source files generated."
            exit 1
          fi

          if [[ ! -d decompiled/resources ]]; then
            echo "::error::Resource directory missing."
            exit 1
          fi

          echo "Source files:"
          find decompiled/sources -type f | wc -l

          echo "Resource files:"
          find decompiled/resources -type f | wc -l

          du -sh decompiled

      - name: Upload Decompiled Sources
        uses: actions/upload-artifact@v4
        with:
          name: decompiled-sources
          path: decompiled/sources/
          if-no-files-found: error
          compression-level: 6
          retention-days: 14

      - name: Upload Decompiled Resources
        uses: actions/upload-artifact@v4
        with:
          name: decompiled-resources
          path: decompiled/resources/
          if-no-files-found: error
          compression-level: 6
          retention-days: 14

      - name: Upload JADX Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jadx-log
          path: jadx.log
          if-no-files-found: ignore
          retention-days: 7
